# SwiftLint configuration
# Inherits from the shared parent configuration in swift-standards

parent_config: https://raw.githubusercontent.com/swift-primitives/.github/main/.swiftlint.yml

# Package-specific overrides
disabled_rules:
  - function_parameter_count
  # no_any_protocol_existential: 71 documented type-erasure sites (TableColumnExpression,
  # Seeds, QueryBinding, TableAlias, etc.) are genuine, deliberate type erasure, not
  # narrowable to generics. Package-level disable per coordinator ruling on
  # swift-primitives/swift-structured-queries-primitives#2, following the same precedent
  # established in swift-bit-primitives and swift-byte-primitives.
  - no_any_protocol_existential
